<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAERVIU — Music · Visuals · Experiments</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    background:#000;
}

body{
    overflow-x:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================================================
   IMAGE DE RÉFÉRENCE
   ========================================================= */

.site{
    position:relative;
    width:100%;
    max-width:1536px;
    margin:0 auto;
    line-height:0;
}

.reference{
    display:block;
    width:100%;
    height:auto;
}

/* =========================================================
   ZONES CLIQUABLES
   ========================================================= */

.hotspot{
    position:absolute;
    display:block;
    z-index:10;
    cursor:pointer;
    background:transparent;
    border:0;
    text-decoration:none;
}

/* NAVIGATION */

.home{
    left:27.8%;
    top:2.0%;
    width:5%;
    height:5%;
}

.music-nav{
    left:33.7%;
    top:2.0%;
    width:5.5%;
    height:5%;
}

.visuals-nav{
    left:41.1%;
    top:2.0%;
    width:6%;
    height:5%;
}

.experiments-nav{
    left:48.5%;
    top:2.0%;
    width:8%;
    height:5%;
}

.about-nav{
    left:58%;
    top:2.0%;
    width:5%;
    height:5%;
}

.contact-nav{
    left:65%;
    top:2.0%;
    width:6%;
    height:5%;
}

/* =========================================================
   HERO
   ========================================================= */

.enter-lab{
    left:28.4%;
    top:44.5%;
    width:14%;
    height:5.5%;
}

.play-intro{
    right:1.8%;
    top:49%;
    width:10%;
    height:6%;
}

/* =========================================================
   CARTES
   ========================================================= */

.music-card{
    left:2.6%;
    top:55.2%;
    width:30.8%;
    height:25.2%;
}

.visuals-card{
    left:34.7%;
    top:55.2%;
    width:30.7%;
    height:25.2%;
}

.experiments-card{
    left:66.1%;
    top:55.2%;
    width:31%;
    height:25.2%;
}

/* =========================================================
   PROJET
   ========================================================= */

.latest-project{
    left:2.6%;
    top:82.2%;
    width:38%;
    height:16%;
}

.listen-now{
    left:42.7%;
    top:88%;
    width:11%;
    height:5%;
}

/* =========================================================
   EFFET LÉGER AU SURVOL
   ========================================================= */

.hotspot:hover{
    background:rgba(212,157,56,0.035);
}

.hotspot:active{
    background:rgba(212,157,56,0.08);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:800px){

    .site{
        width:100%;
    }

    /*
       On conserve exactement les proportions
       de la référence.
    */

    .hotspot{
        -webkit-tap-highlight-color:transparent;
    }
}
</style>
</head>

<body>

<div class="site">

    <!-- IMAGE EXACTE DE LA RÉFÉRENCE -->
    <img
        src="reference.png"
        class="reference"
        alt="HAERVIU — Music Visuals Experiments"
    >

    <!-- NAVIGATION -->

    <a href="#home"
       class="hotspot home"
       aria-label="Home"></a>

    <a href="#music"
       class="hotspot music-nav"
       aria-label="Music"></a>

    <a href="#visuals"
       class="hotspot visuals-nav"
       aria-label="Visuals"></a>

    <a href="#experiments"
       class="hotspot experiments-nav"
       aria-label="Experiments"></a>

    <a href="#about"
       class="hotspot about-nav"
       aria-label="About"></a>

    <a href="#contact"
       class="hotspot contact-nav"
       aria-label="Contact"></a>


    <!-- HERO -->

    <a href="#music"
       class="hotspot enter-lab"
       aria-label="Enter the Lab"></a>

    <a href="#intro"
       class="hotspot play-intro"
       aria-label="Play Intro"></a>


    <!-- CARTES -->

    <a href="#music"
       class="hotspot music-card"
       aria-label="Music"></a>

    <a href="#visuals"
       class="hotspot visuals-card"
       aria-label="Visuals"></a>

    <a href="#experiments"
       class="hotspot experiments-card"
       aria-label="Experiments"></a>


    <!-- LATEST PROJECT -->

    <a href="#latest"
       class="hotspot latest-project"
       aria-label="New Horizons"></a>

    <a href="#latest"
       class="hotspot listen-now"
       aria-label="Listen Now"></a>

</div>


<!-- =========================================================
     ANCRES
     ========================================================= -->

<div id="home"></div>
<div id="music"></div>
<div id="visuals"></div>
<div id="experiments"></div>
<div id="about"></div>
<div id="contact"></div>
<div id="intro"></div>
<div id="latest"></div>

</body>
</html>
