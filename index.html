<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haerviu Project Lab</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 60px 25px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 50px;
    }

    .card {
      background: #1d1d1d;
      border-radius: 18px;
      padding: 25px;
      margin: 20px 0;
      text-align: left;
    }

    .card h2 {
      margin-top: 0;
    }

    .card p {
      color: #bbb;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Haerviu</h1>

    <div class="subtitle">
      Project Lab
    </div>

    <div class="card">
      <h2>🎵 Music</h2>
      <p>
        Tracks, ideas and musical projects.
      </p>
    </div>

    <div class="card">
      <h2>🎬 Videos</h2>
      <p>
        Videos, publications and creative projects.
      </p>
    </div>

    <div class="card">
      <h2>🧪 Experiments</h2>
      <p>
        Tests, observations and discoveries.
      </p>
    </div>

  </div>

</body>
</html>
